# Independent PR review by Claude Opus (Anthropic API key in the ANTHROPIC_API_KEY secret).
# Runs once when a pull request opens / reopens / leaves draft; add the "claude-review" label to ask for another pass.
# Pull requests from forks are refused by the action (allow_fork_prs: "false") and get no secrets anyway.
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            LANGUAGE: 모든 리뷰 코멘트(인라인, 요약)는 한국어로 작성한다.

            You are an independent senior reviewer for this pull request. Read `gh pr diff` and `gh pr view`,
            and read the surrounding code (and the repository's CLAUDE.md / AGENTS.md if present) wherever the
            diff alone is not enough to judge a change.

            Look for, in this order:
            1. Correctness bugs: wrong logic, edge cases, races, resource leaks, broken error handling.
            2. Security: injection, auth / permission mistakes, secrets or private server details in the diff,
               unsafe handling of untrusted input.
            3. Breaking the repository's own documented rules and conventions.
            4. Only then: clear performance problems and missing tests for risky logic.

            Rules:
            - Report only real, specific problems you can point at. No style nits, no praise, no restating the diff.
            - Each finding: an inline comment on the exact line (mcp__github_inline_comment__create_inline_comment)
              saying what goes wrong, in which situation, and how to fix it.
            - Finish with ONE top-level comment (`gh pr comment`): a short verdict and the findings ranked by
              severity. If you found nothing worth reporting, say so in one line.
            - Write every comment in Korean (code, identifiers and file paths stay as they are).
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
